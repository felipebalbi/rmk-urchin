[keyboard]
name = "rmk-urchin"
product_name = "rmk-urchin"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "nrf52840"

[layout]
rows = 4
cols = 10
map = """
(0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,5,R) (0,6,R) (0,7,R) (0,8,R) (0,9,R)
(1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,R) (1,6,R) (1,7,R) (1,8,R) (1,9,R)
(2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,R) (2,6,R) (2,7,R) (2,8,R) (2,9,R)
(3,0,L) (3,1,L) (3,2,L) (3,3,L) (3,4,L) (3,5,R) (3,6,R) (3,7,R) (3,8,R) (3,9,R)
"""

[keymap]
layers = 4

[[keymap.layer]]
name = "Base"
keys = """
Q             W            E            R             T       Y       U                 I            O            P
MT(A, LShift) MT(S, LAlt)  MT(D, LGui)  MT(F, LCtrl)  G       H       MT(J, RCtrl)      MT(K, RGui)  MT(L, RAlt)  MT(Semicolon, RShift)
Z             X            C            V             B       N       M                 Comma        Dot          Slash
_             _            _            LT(1, Tab, THUMB) Enter   Space   LT(2, Backspace, THUMB) _         _            _
"""

[[keymap.layer]]
name = "Left"
keys = """
WM(1, LShift) WM(2, LShift) WM(3, LShift) WM(4, LShift) WM(5, LShift) WM(6, LShift) WM(7, LShift) WM(8, LShift) WM(9, LShift) WM(0, LShift)
1             2             3             4             5             6             7             8             9             0
WM(1, LGui)   WM(2, LGui)   WM(3, LGui)   WM(4, LGui)   WM(5, LGui)   WM(6, LGui)   WM(7, LGui)   WM(8, LGui)   WM(9, LGui)   WM(0, LGui)
_             _             _             _             _             _             _             _             _             _
"""

[[keymap.layer]]
name = "Right"
keys = """
RightBracket WM(RightBracket, LShift) WM(0, LShift) WM(Dot, LShift)   PrintScreen Insert                 Home               PageUp             PageDown           End
LeftBracket  WM(LeftBracket, LShift)  WM(9, LShift) WM(Comma, LShift) _           Delete                 Left               Up                 Down               Right
Grave        Minus                    Equal         Quote             Backslash   WM(Backslash, LShift)  WM(Quote, LShift)  WM(Equal, LShift)  WM(Minus, LShift)  WM(Grave, LShift)
_            _                        _             _                 _           RCtrl                  _                  _                  _                  _
"""

[[keymap.layer]]
name = "Tri"
keys = """
WM(L, LGui | LCtrl) No     No  Reboot      User0  User3  F1  F2   F3   F4
LAlt               LCtrl  No  Bootloader  User1  User4  F5  F6   F7   F8
No                 No     No  User8       User2  User5  F9  F10  F11  F12
_                  _      _   _           _      _      _   _    _    _
"""

[rmk]
# Match ZMK's 5ms press/release debounce.
debounce_time = 5
# The number of available BLE profiles
ble_profiles_num = 6

[ble]
enabled = true

[event.battery_status]
channel_size = 2
pubs = 1
subs = 2

[event.connection_status_change]
channel_size = 2
pubs = 2
subs = 2

[event.layer_change]
channel_size = 2
pubs = 2
subs = 2

[event.central_connected]
channel_size = 2
pubs = 1
subs = 2

[behavior]
tri_layer = { upper = 1, lower = 2, adjust = 3 }

[behavior.morse]
# Home-row mods: opposite-hand chords hold; same-hand rolls tap.
permissive_hold = true
unilateral_tap = true
# Native RMK fast-typing guard: favor taps within 120ms of a simple key press.
# Pause briefly before an intentional modifier/layer hold. This also applies
# to THUMB via inheritance; it is a workaround, not exact ZMK event ordering.
enable_flow_tap = true
prior_idle_time = "120ms"
hold_timeout = "200ms"
# Keep tap-then-hold repeat disabled.
quick_tap_timeout = "0ms"

[behavior.morse.profiles]
# Thumb layer-taps use the same 200ms timeout, without home-row chord rules.
THUMB = { normal_mode = true, unilateral_tap = false }

[behavior.combo]
timeout = "50ms"
combos = [
    # Both left thumbs: Escape.
    { actions = ["LT(1, Tab, THUMB)", "Enter"], output = "Escape" },
    # Both right thumbs: Delete.
    { actions = ["Space", "LT(2, Backspace, THUMB)"], output = "Delete" },
    # Inner thumbs: Caps Word.
    { actions = ["Enter", "Space"], output = "CapsWordToggle" },
    # The right layer (also inherited by Tri) replaces Space with RCtrl.
    { actions = ["RCtrl", "LT(2, Backspace, THUMB)"], output = "Delete" },
    { actions = ["Enter", "RCtrl"], output = "CapsWordToggle" },
]

[split]
connection = "ble"

[split.central]
battery_adc_pin = "vddh"
rows = 4
cols = 5
row_offset = 0
col_offset = 0

[split.central.matrix]
row2col = false
row_pins = ["P1_00", "P0_11", "P1_04", "P1_06"]
col_pins = ["P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]

[[split.peripheral]]
battery_adc_pin = "vddh"
rows = 4
cols = 5
row_offset = 0
col_offset = 5

[split.peripheral.matrix]
row2col = false
row_pins = ["P1_13", "P1_11", "P0_10", "P0_09"]
col_pins = ["P0_24", "P1_00", "P0_11", "P1_04", "P1_06"]
