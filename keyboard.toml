[keyboard]
name = "rmk-urchin"
product_name = "rmk-urchin"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "nrf52840"

[layout]
rows = 4
cols = 10
map = """
(0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,5,R) (0,6,R) (0,7,R) (0,8,R) (0,9,R)
(1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,R) (1,6,R) (1,7,R) (1,8,R) (1,9,R)
(2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,R) (2,6,R) (2,7,R) (2,8,R) (2,9,R)
                        (3,3,L) (3,4,L) (3,5,R) (3,6,R)
"""

[keymap]
layers = 7
# REMAKE's QWERTY Miryoku layers, adapted to two physical thumbs per hand.
# Keep REMAKE's middle/inner left and inner/middle right thumb order on all layers.
# Each same-hand thumb chord replaces its missing tertiary thumb on every layer.

[[keymap.layer]]
name = "Base"
keys = """
Q             W            E            R             T       Y       U                 I            O            P
MT(A, LShift) MT(S, LAlt)  MT(D, LGui)  MT(F, LCtrl)  G       H       MT(J, RCtrl)      MT(K, RGui)  MT(L, RAlt)  MT(Semicolon, RShift)
Z             X            C            V             B       N       M                 Comma        Dot          Slash
                           LT(1, Enter, THUMB) LT(2, Tab, THUMB) LT(5, Backspace, THUMB) LT(4, Space, THUMB)
"""

[[keymap.layer]]
name = "Nav"
keys = """
TD(0)  No   No   No    No  WM(Y, LCtrl)    WM(Insert, LShift) WM(Insert, LCtrl) WM(Delete, LShift) Undo
LShift LAlt LGui LCtrl No  CapsWordToggle Left               Down              Up                 Right
No     No   No   No    No  Insert         Home               PageDown          PageUp             End
                 No No Backspace Space
"""

[[keymap.layer]]
name = "Mouse"
keys = """
TD(0)  No   No   No    No  WM(Y, LCtrl) WM(Insert, LShift) WM(Insert, LCtrl) WM(Delete, LShift) Undo
LShift LAlt LGui LCtrl No  No       MouseLeft          MouseDown         MouseUp            MouseRight
No     No   No   No    No  No       MouseWheelLeft     MouseWheelDown    MouseWheelUp       MouseWheelRight
                 No No MouseBtn2 MouseBtn1
"""

[[keymap.layer]]
name = "Media"
keys = """
TD(0)  No   No   No    No  No    No             No           No         No
LShift LAlt LGui LCtrl No  No    MediaPrevTrack AudioVolDown AudioVolUp MediaNextTrack
No     No   No   No    No  User7 User0          User1        User2      User3
                 No No MediaStop MediaPlayPause
"""

[[keymap.layer]]
name = "Num"
keys = """
LeftBracket 7 8 9 RightBracket No No    No   No   TD(0)
Quote       4 5 6 Equal        No RCtrl RGui RAlt RShift
Grave       1 2 3 Backslash    No No    No   No   No
              0 Minus No No
"""

[[keymap.layer]]
name = "Sym"
keys = """
WM(LeftBracket, LShift) WM(7, LShift) WM(8, LShift) WM(9, LShift) WM(RightBracket, LShift) No No    No   No   TD(0)
WM(Quote, LShift)       WM(4, LShift) WM(5, LShift) WM(6, LShift) WM(Equal, LShift)        No RCtrl RGui RAlt RShift
WM(Grave, LShift)       WM(1, LShift) WM(2, LShift) WM(3, LShift) WM(Backslash, LShift)    No No    No   No   No
                                    WM(0, LShift) WM(Minus, LShift) No No
"""

[[keymap.layer]]
name = "Fun"
keys = """
F12 F7 F8 F9 PrintScreen No No    No   No   TD(0)
F11 F4 F5 F6 ScrollLock  No RCtrl RGui RAlt RShift
F10 F1 F2 F3 Pause       No No    No   No   No
        Enter Tab No No
"""

[rmk]
# Match ZMK's 5ms press/release debounce.
debounce_time = 5
# Miryoku's BT0..BT3. User7 is the USB/BLE toggle with this profile count.
ble_profiles_num = 4
# enable sleep
split_central_sleep_timeout_seconds = 30

[ble]
enabled = true

[host]
# Enter + Space (both outer thumbs), on real switches rather than empty slots.
unlock_keys = [[3, 3], [3, 6]]

[event.battery_status]
channel_size = 2
pubs = 1
subs = 2

[event.connection_status_change]
channel_size = 2
pubs = 2
subs = 2

[event.layer_change]
channel_size = 2
pubs = 2
subs = 2

[event.central_connected]
channel_size = 2
pubs = 1
subs = 2

[event.sleep_state]
# One local screen; RMK reserves split-link subscribers separately.
channel_size = 1
pubs = 1
subs = 1

[behavior.morse]
# Home-row mods: opposite-hand chords hold; same-hand rolls tap.
permissive_hold = true
unilateral_tap = true
# Retain following presses/releases until the home-row or thumb owner decides.
buffered_tap_hold = true
enable_flow_tap = false
# Inactive while flow-tap is disabled; retained for the legacy-policy comparison.
prior_idle_time = "120ms"
hold_timeout = "200ms"
# Keep tap-then-hold repeat disabled.
quick_tap_timeout = "0ms"

[behavior.morse.profiles]
# Thumb layer-taps use the same 200ms timeout, without home-row chord rules.
THUMB = { normal_mode = true, unilateral_tap = false }
# Combo outputs use RMK's synthetic-event path, not physical ordered tap/hold.
# Resolve on another press so early Media/Fun keys cannot leak onto Base.
CHORD = { hold_on_other_press = true, unilateral_tap = false }
BOOT = { normal_mode = true, unilateral_tap = false, gap_timeout = "200ms" }

[[behavior.morse.morses]]
# Hold a layer thumb/chord, then double-tap the same-hand top-row pinkie.
tap = "No"
hold = "No"
double_tap = "Bootloader"
hold_after_tap = "No"
profile = "BOOT"

[behavior.combo]
timeout = "50ms"
combos = [
    # Base: tertiary tap AND hold, with no individual thumb actions leaking.
    { actions = ["LT(1, Enter, THUMB)", "LT(2, Tab, THUMB)"], output = "LT(3, Escape, CHORD)", layer = 0 },
    { actions = ["LT(5, Backspace, THUMB)", "LT(4, Space, THUMB)"], output = "LT(6, Delete, CHORD)", layer = 0 },
    # Opposite-hand sublayers retain each missing tertiary thumb's function.
    { actions = ["Backspace", "Space"], output = "Delete", layer = 1 },
    { actions = ["MouseBtn2", "MouseBtn1"], output = "MouseBtn3", layer = 2 },
    { actions = ["MediaStop", "MediaPlayPause"], output = "AudioMute", layer = 3 },
    { actions = ["0", "Minus"], output = "Dot", layer = 4 },
    { actions = ["WM(0, LShift)", "WM(Minus, LShift)"], output = "WM(9, LShift)", layer = 5 },
    { actions = ["Enter", "Tab"], output = "Application", layer = 6 },
]

[split]
connection = "ble"

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0

[split.central.battery]
battery_adc_pin = "vddh"

[split.central.matrix]
row2col = false
row_pins = ["P1_00", "P0_11", "P1_04", "P1_06"]
col_pins = ["P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]

[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5

[split.peripheral.battery]
battery_adc_pin = "vddh"

[split.peripheral.matrix]
row2col = false
row_pins = ["P1_13", "P1_11", "P0_10", "P0_09"]
col_pins = ["P0_24", "P1_00", "P0_11", "P1_04", "P1_06"]
