[keyboard]
name = "rmk-urchin"
product_name = "rmk-urchin"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "nrf52840"

[layout]
rows = 4
cols = 10
map = """
(0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,5,R) (0,6,R) (0,7,R) (0,8,R) (0,9,R)
(1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,R) (1,6,R) (1,7,R) (1,8,R) (1,9,R)
(2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,R) (2,6,R) (2,7,R) (2,8,R) (2,9,R)
(3,0,L) (3,1,L) (3,2,L) (3,3,L) (3,4,L) (3,5,R) (3,6,R) (3,7,R) (3,8,R) (3,9,R)
"""

[keymap]
layers = 4

[[keymap.layer]]
name = "Base"
keys = """
Q             W            E            R             T       Y       U                 I            O            P
MT(A, LShift) MT(S, LAlt)  MT(D, LGui)  MT(F, LCtrl)  G       H       MT(J, RCtrl)      MT(K, RGui)  MT(L, RAlt)  MT(Semicolon, RShift)
Z             X            C            V             B       N       M                 Comma        Dot          Slash
_             _            _            LT(1, Tab)    Enter   Space   LT(2, Backspace)  _            _            _
"""

[[keymap.layer]]
name = "Left"
keys = """
WM(1, LShift) WM(2, LShift) WM(3, LShift) WM(4, LShift) WM(5, LShift) WM(6, LShift) WM(7, LShift) WM(8, LShift) WM(9, LShift) WM(0, LShift)
1             2             3             4             5             6             7             8             9             0
WM(1, LGui)   WM(2, LGui)   WM(3, LGui)   WM(4, LGui)   WM(5, LGui)   WM(6, LGui)   WM(7, LGui)   WM(8, LGui)   WM(9, LGui)   WM(0, LGui)
_             _             _             -             -             -             -             _             _             _
"""

[[keymap.layer]]
name = "Right"
keys = """
RightBracket WM(RightBracket, LShift) WM(0, LShift) WM(Dot, LShift)   PrintScreen Insert                 Home               PageUp             PageDown           End
LeftBracket  WM(LeftBracket, LShift)  WM(9, LShift) WM(Comma, LShift) -           Delete                 Left               Up                 Down               Right
Grave        Minus                    Equal         Quote             Backslash   WM(Backslash, LShift)  WM(Quote, LShift)  WM(Equal, LShift)  WM(Minus, LShift)  WM(Grave, LShift)
_            _                        _             -                 -           RCtrl                  -                  _                  _                  _
"""

[[keymap.layer]]
name = "Tri"
# The old Lock at (0,0) was unsupported in RMK 0.7; keep it inert for now.
keys = """
No    No     No  Reboot      User0  User3  F1  F2   F3   F4
LAlt  LCtrl  No  Bootloader  User1  User4  F5  F6   F7   F8
No    No     No  User9       User2  User5  F9  F10  F11  F12
_     _      _   -           -      -      -   _    _    _
"""

[rmk]
# The number of available BLE profiles
ble_profiles_num = 6

[ble]
enabled = true

[behavior]
tri_layer = { upper = 1, lower = 2, adjust = 3 }

[behavior.morse]
# RMK 0.7 gave permissive_hold precedence over hold_on_other_press.
permissive_hold = true
unilateral_tap = true
# Preserve the old enable_hrm default; prior_idle_time is inactive without it.
enable_flow_tap = false
prior_idle_time = "120ms"
hold_timeout = "250ms"

[split]
connection = "ble"

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0

[split.central.matrix]
row2col = false
row_pins = ["P1_00", "P0_11", "P1_04", "P1_06"]
col_pins = ["P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]

[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5

[split.peripheral.matrix]
row2col = false
row_pins = ["P1_13", "P1_11", "P0_10", "P0_09"]
col_pins = ["P0_24", "P1_00", "P0_11", "P1_04", "P1_06"]
